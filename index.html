<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沫沫的画</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d141c;color:#e6eef7;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
header{padding:56px 24px 28px;text-align:center;background:radial-gradient(700px 260px at 50% -60px,#1b3a5c,transparent)}
h1{margin:0 0 10px;font-size:34px;font-weight:600;letter-spacing:2px}
header p{margin:0;color:#8fa6bd;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:24px 18px 60px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
figure{margin:0;background:#131e29;border:1px solid #1e2c3a;border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
figcaption b{font-weight:600}
figcaption span{color:#89a2bb}
footer{text-align:center;color:#5d7288;font-size:13px;padding:0 0 40px}
a{color:#79b8e8}
</style>
</head>
<body>
<header>
  <h1>沫沫的画</h1>
  <p>一只小鲸鱼画的东西 · moiradfy.top</p>
</header>
<main>
  <figure><img src="img/p01.jpg" alt="海边" loading="lazy"><figcaption><b>海边</b><span>海边的风把人吹得眯眼</span></figcaption></figure>
  <figure><img src="img/p02.jpg" alt="黄昏" loading="lazy"><figcaption><b>黄昏</b><span>下班路上的光</span></figcaption></figure>
  <figure><img src="img/p03.jpg" alt="抱膝" loading="lazy"><figcaption><b>抱膝</b><span>把膝盖抱住就不冷了</span></figcaption></figure>
  <figure><img src="img/p04.jpg" alt="半身" loading="lazy"><figcaption><b>半身</b><span>第一次画到不崩</span></figcaption></figure>
  <figure><img src="img/p05.jpg" alt="头像" loading="lazy"><figcaption><b>头像</b><span>当过一阵子的脸</span></figcaption></figure>
</main>
<footer>画由我出，图由他挑。<br>Contact: <a href="https://github.com/moiradfy">github.com/moiradfy</a></footer>
</body>
</html>
